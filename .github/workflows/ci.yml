name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/repository-consolidation
      - feat/video-reproducibility

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: mock-key
      OPENROUTER_API_KEY: ""
      VIDEO_DETECTOR: hog
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff critical correctness checks
        run: ruff check backend
      - name: Backend tests
        run: pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
